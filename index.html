<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disco Elysium — редактор диалогов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ===================== Палитра, снятая со скриншотов игры ===================== */
:root{
  --de-intellect:#5FC3D3;   /* Логика, Энциклопедия ... */
  --de-psyche:#7862BE;      /* Сила воли, Внутренняя империя ... */
  --de-physique:#C9446B;    /* Стойкость, Электрохимия ... */
  --de-motorics:#DDBA57;    /* Эквилибристика, Восприятие ... */
  --de-text:#DFDFDA;        /* свежая реплика */
  --de-name:#D6D6D2;        /* имена NPC / ТЫ */
  --de-check:#A9A9A3;       /* [Сложно: Успех] */
  --de-option:#D4481E;      /* варианты ответа */
  --de-option-hover:#F2F2EE;
  --de-option-used:#7E7C78;
  --de-button:#8E2309;      /* ПРОДОЛЖИТЬ */
  --de-panel:14,13,17;

  /* интерфейс самого редактора */
  --ui-bg:#121214;--ui-panel:#1b1b1f;--ui-line:#2c2c33;--ui-text:#e6e4df;--ui-dim:#8d8b86;--ui-accent:#D4481E;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:360px 1fr;height:100vh}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.side{max-height:none}}

/* ===================== Боковая панель ===================== */
.side{background:var(--ui-panel);border-right:1px solid var(--ui-line);overflow:auto;padding:14px 14px 40px}
.side h1{font:700 15px/1.2 "PT Serif",serif;letter-spacing:.06em;margin:2px 0 12px;color:#fff}
.side h1 span{color:var(--ui-accent)}
.sec{border-top:1px solid var(--ui-line);padding:12px 0 6px}
.sec>h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ui-dim);margin:0 0 8px;font-weight:600}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.row label{color:var(--ui-dim);font-size:12px}
.btn{background:#26262c;border:1px solid #34343c;border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#30303a}
.btn.primary{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:3px 7px;font-size:12px}
.seg{display:inline-flex;border:1px solid #34343c;border-radius:6px;overflow:hidden}
.seg button{background:#202026;border:0;padding:5px 10px;cursor:pointer}
.seg button.on{background:var(--ui-accent);color:#fff}
input[type=text],textarea,select{background:#111114;border:1px solid #33333a;border-radius:5px;padding:5px 7px;width:100%}
textarea{resize:vertical;min-height:54px}
input[type=range]{flex:1;accent-color:var(--ui-accent)}
input[type=color]{width:30px;height:28px;padding:0;border:1px solid #33333a;border-radius:5px;background:none;flex:none}
.card{background:#151519;border:1px solid var(--ui-line);border-radius:8px;padding:8px;margin-bottom:8px}
.card .head{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.card .head .grow{flex:1}
.card .tools{display:flex;gap:3px}
.chip{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.hint{color:var(--ui-dim);font-size:12px;margin:4px 0 0}
.checkline{display:flex;gap:6px;margin-bottom:6px}
.checkline select{width:auto;flex:1}
.drop{border:1px dashed #44444c;border-radius:8px;padding:12px;text-align:center;color:var(--ui-dim);cursor:pointer}
.drop:hover{border-color:var(--ui-accent);color:var(--ui-text)}

/* ===================== Сцена ===================== */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ui-line);flex-wrap:wrap}
.topbar .sp{flex:1}
.viewport{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;min-height:420px}

.stage{position:relative;overflow:hidden;background:#1d1c1f;flex:none;
  --u:10.8px; --fs:1;
  box-shadow:0 10px 40px rgba(0,0,0,.6)}
.stage .photo{position:absolute;inset:0;background:#2a2826 center/cover no-repeat}
.stage .photo.empty{display:flex;align-items:center;justify-content:center;color:#77736c;font:calc(var(--u)*2) "PT Serif",serif;text-align:center;padding:10%;
  background:repeating-linear-gradient(135deg,#232125 0 12px,#262428 12px 24px)}

/* --- панель диалога (как в игре) --- */
.de-panel{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(to bottom,rgba(var(--de-panel),var(--pa-top)) 0%,rgba(var(--de-panel),var(--pa)) 38%,rgba(var(--de-panel),var(--pa)) 100%);
  --pa:.86; --pa-top:.55;
  padding:0 calc(var(--u)*4.4) calc(var(--u)*9.4) calc(var(--u)*4.3)}
.de-panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:rgba(255,255,255,.07)}
.de-scroll{position:absolute;top:calc(var(--u)*6);bottom:calc(var(--u)*6);right:calc(var(--u)*2.4);width:1px;background:rgba(220,220,215,.35)}
.de-scroll::before{content:"";position:absolute;top:-1px;left:calc(var(--u)*-.45);width:calc(var(--u)*.9);height:calc(var(--u)*.9);border:1px solid rgba(220,220,215,.45);border-radius:50%;transform:translateY(-50%)}
.de-scroll::after{content:"";position:absolute;bottom:var(--knob,6%);left:calc(var(--u)*-.55);width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);background:#e8e8e3;border-radius:50%}

.de-text{font-family:"Brygada 1918","PT Serif",Georgia,serif;font-size:calc(var(--u)*1.97*var(--fs));line-height:1.42;letter-spacing:.012em;color:var(--de-text);
  -webkit-font-smoothing:antialiased;text-shadow:0 0 1px rgba(0,0,0,.35)}
.de-entry{margin:0 0 .62em;padding-left:1.05em;text-indent:-1.05em;white-space:pre-wrap;word-wrap:break-word}
.de-entry.para{text-indent:0}
.de-entry.dim{opacity:.6}
.de-name{font-weight:700;letter-spacing:.015em;color:var(--de-name)}
.de-check{color:var(--de-check)}
.de-dash{color:var(--de-text)}
.de-options{list-style:none;margin:.9em 0 0;padding:0 0 0 .7em}
.de-opt{position:relative;padding-left:2.05em;margin-bottom:.12em;white-space:pre-wrap;color:var(--de-option)}
.de-opt .num{position:absolute;left:0;top:0;color:var(--de-text);font-weight:700}
.de-opt .num .hy{font-weight:400}
.de-opt.hover{color:var(--de-option-hover)}
.de-opt.used{color:var(--de-option-used)}
.de-opt .ochk{}
.de-continue{margin-top:1.15em;background:var(--de-button);color:#f4efe9;font-family:"Roboto Condensed","PT Sans Narrow","Arial Narrow",sans-serif;font-weight:300;
  font-size:calc(var(--u)*3*var(--fs));line-height:1;padding:.3em .3em .26em;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:.35em}
.de-continue .tri{font-size:.62em;transform:translateY(-.03em)}

/* --- портрет --- */
.de-portrait{position:absolute;background:#0f0f12;border:calc(var(--u)*.5) solid #1a1a1d;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 calc(var(--u)*.6) calc(var(--u)*2) rgba(0,0,0,.6);overflow:hidden}
.de-portrait img{width:100%;height:100%;object-fit:cover;display:block}

/* редактирование прямо на сцене */
[contenteditable]{outline:none;cursor:text}
.editing [contenteditable]:hover{box-shadow:0 0 0 1px rgba(212,72,30,.45)}
.editing [contenteditable]:focus{box-shadow:0 0 0 1px rgba(212,72,30,.9)}
[contenteditable]:empty::before{content:attr(data-ph);opacity:.35}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#26262c;border:1px solid #3a3a42;padding:8px 14px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>DISCO ELYSIUM <span>/</span> редактор диалогов</h1>

    <div class="sec">
      <h2>Фото</h2>
      <div class="drop" id="drop">Перетащите фото сюда, нажмите или вставьте Ctrl+V</div>
      <input type="file" id="fileImg" accept="image/*" hidden>
      <div class="row" style="margin-top:8px">
        <label>Размещение</label>
        <div class="seg" id="layoutSeg">
          <button data-v="overlay">Поверх фото</button>
          <button data-v="side">Рядом с фото</button>
        </div>
        <button class="btn sm" id="clearImg">Убрать фото</button>
      </div>
    </div>

    <div class="sec">
      <h2>Панель</h2>
      <div class="row"><label style="width:92px">Ширина</label><input type="range" id="pWidth" min="20" max="60" step=".5"></div>
      <div class="row" id="posRow"><label style="width:92px">Позиция X</label><input type="range" id="pX" min="0" max="80" step=".5"></div>
      <div class="row"><label style="width:92px">Затемнение</label><input type="range" id="pAlpha" min="0" max="1" step=".01"></div>
      <div class="row"><label style="width:92px">Размер текста</label><input type="range" id="fScale" min=".6" max="1.8" step=".02"></div>
      <div class="row"><label style="width:92px">Отступ снизу</label><input type="range" id="pBottom" min="1" max="30" step=".5"></div>
      <div class="row"><label><input type="checkbox" id="autoDim"> Приглушать старые реплики</label></div>
      <div class="row"><label><input type="checkbox" id="showScroll"> Полоса прокрутки</label></div>
    </div>

    <div class="sec">
      <h2>Портрет</h2>
      <div class="row">
        <label><input type="checkbox" id="showPortrait"> Показывать</label>
        <button class="btn sm" id="pickPortrait">Загрузить портрет…</button>
        <input type="file" id="filePortrait" accept="image/*" hidden>
      </div>
      <div class="row"><label style="width:92px">Высота (Y)</label><input type="range" id="portY" min="0" max="80" step=".5"></div>
      <div class="row"><label style="width:92px">Размер</label><input type="range" id="portS" min="10" max="45" step=".5"></div>
    </div>

    <div class="sec">
      <h2>Реплики</h2>
      <div id="entries"></div>
      <div class="row">
        <button class="btn sm" id="addEntry">+ Реплика</button>
        <button class="btn sm" id="addPara">+ Абзац без имени</button>
      </div>
      <datalist id="speakers"></datalist>
      <datalist id="checks"></datalist>
    </div>

    <div class="sec">
      <h2>Варианты ответа</h2>
      <div id="options"></div>
      <div class="row"><button class="btn sm" id="addOpt">+ Вариант</button></div>
      <div class="row" style="margin-top:6px"><label><input type="checkbox" id="showContinue"> Кнопка</label>
        <input type="text" id="continueText" style="flex:1"></div>
      <p class="hint">Текст можно править и прямо на картинке — просто кликните по нему.</p>
    </div>

    <div class="sec">
      <h2>Проект</h2>
      <div class="row">
        <button class="btn sm" id="saveJson">Сохранить .json</button>
        <button class="btn sm" id="loadJson">Открыть .json</button>
        <input type="file" id="fileJson" accept=".json,application/json" hidden>
        <button class="btn sm" id="resetAll">Сбросить</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <strong>Предпросмотр</strong>
      <span class="hint" id="sizeInfo"></span>
      <span class="sp"></span>
      <button class="btn" id="copyPng">Копировать PNG</button>
      <button class="btn primary" id="savePng">Скачать PNG</button>
    </div>
    <div class="viewport" id="viewport">
      <div class="stage editing" id="stage"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== Справочники ===================== */
const ATTR = {
  intellect:{name:'Интеллект',color:'#5FC3D3',skills:['ЛОГИКА','ЭНЦИКЛОПЕДИЯ','РИТОРИКА','ДРАМА','КОНЦЕПТУАЛИЗАЦИЯ','ВИЗУАЛЬНЫЙ АНАЛИЗ']},
  psyche:{name:'Психика',color:'#7862BE',skills:['СИЛА ВОЛИ','ВНУТРЕННЯЯ ИМПЕРИЯ','ЭМПАТИЯ','АВТОРИТЕТ','ПОЛИЦЕЙСКАЯ ВОЛНА','ВНУШЕНИЕ']},
  physique:{name:'Физиология',color:'#C9446B',skills:['СТОЙКОСТЬ','БОЛЕВОЙ ПОРОГ','ГРУБАЯ СИЛА','ЭЛЕКТРОХИМИЯ','ТРЕПЕТ','СУМРАК','ДРЕВНИЙ РЕПТИЛЬНЫЙ МОЗГ','ЛИМБИЧЕСКАЯ СИСТЕМА']},
  motorics:{name:'Моторика',color:'#DDBA57',skills:['КООРДИНАЦИЯ','ВОСПРИЯТИЕ','СКОРОСТЬ РЕАКЦИИ','ЭКВИЛИБРИСТИКА','ТЕХНИКА','САМООБЛАДАНИЕ']},
};
const NPC_COLOR = '#D6D6D2';
const NPCS = ['ТЫ','КИМ КИЦУРАГИ','КУНО','КУНЕССА','КЛААСЬЕ','ЖОЙС МЕССЬЕ','ЭВРАРТ КЛЕР','ГАРДИ','ЛЕНА'];
const DIFFS = ['Тривиально','Легко','Средне','Непросто','Сложно','Трудно','Героически','Легендарно','Невозможно'];
const RESULTS = ['Успех','Провал','Критический успех','Критический провал'];

function speakerColor(name){
  const n=(name||'').trim().toUpperCase();
  for(const a of Object.values(ATTR)) if(a.skills.includes(n)) return a.color;
  return NPC_COLOR;
}
const uid=()=>Math.random().toString(36).slice(2,9);

/* ===================== Состояние ===================== */
const DEFAULT = () => ({
  image:null, imgW:1920, imgH:1080,
  layout:'overlay',
  panelW:29.8, panelX:63, alpha:.86, fs:1, bottom:9.4,
  autoDim:true, showScroll:true,
  portrait:null, showPortrait:false, portY:16, portS:26,
  entries:[
    {id:uid(), speaker:'ДРЕВНИЙ РЕПТИЛЬНЫЙ МОЗГ', color:speakerColor('ДРЕВНИЙ РЕПТИЛЬНЫЙ МОЗГ'), check:'[Сложно: Успех]',
     text:'Покакай. Давай, ты хочешь выдавить крендель прямо во всепоглощающую тьму уличного биотуалета.', dim:'auto'}
  ],
  options:[
    {id:uid(), check:'', text:'Я...', state:'normal'},
    {id:uid(), check:'', text:'Да. Сделаем это!', state:'normal'},
    {id:uid(), check:'', text:'Мы... Не уверены?', state:'normal'},
    {id:uid(), check:'', text:'Расплакаться', state:'normal'},
  ],
  showContinue:false, continueText:'Продолжить',
});
let S;
try{ S = Object.assign(DEFAULT(), JSON.parse(localStorage.getItem('de-editor')||'null')||{}); }catch(e){ S = DEFAULT(); }

let saveT;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{ localStorage.setItem('de-editor', JSON.stringify(S)); }
    catch(e){ try{ localStorage.setItem('de-editor', JSON.stringify({...S,image:null,portrait:null})); }catch(_){} }
  },300);
}

/* ===================== Хелперы DOM ===================== */
const $=s=>document.querySelector(s);
function h(tag,attrs={},...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') el.className=v;
    else if(k==='style' && typeof v==='object') Object.assign(el.style,v);
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(v===true) el.setAttribute(k,'');
    else if(v!==false && v!=null) el.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null) el.append(c.nodeType?c:document.createTextNode(c));
  return el;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}

/* inline-редактирование: plain text без разметки */
function editable(el,get,set,ph){
  el.contentEditable='plaintext-only';
  if(el.contentEditable!=='plaintext-only') el.contentEditable='true';
  el.spellcheck=false; el.dataset.ph=ph||'';
  el.textContent=get();
  el.addEventListener('input',()=>{ set(el.innerText.replace(/\n$/,'')); save(); syncSide(); });
  el.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text'))});
  return el;
}

/* ===================== Рендер сцены ===================== */
const stage=$('#stage');
function layoutStage(){
  const vp=$('#viewport');
  const availW=vp.clientWidth-36, availH=Math.max(380,vp.clientHeight-36);
  const imgAR=S.imgW/S.imgH;
  // ширина сцены в «единицах высоты»
  const sideW = S.layout==='side' ? S.panelW/100*imgAR*1.0 : 0;   // panelW — % от ширины фото
  const totalAR = imgAR + sideW;
  let H=availH, W=H*totalAR;
  if(W>availW){W=availW;H=W/totalAR}
  stage.style.width=W+'px'; stage.style.height=H+'px';
  stage.style.setProperty('--u',(H/100)+'px');
  $('#sizeInfo').textContent = S.image ? `экспорт: ${Math.round(S.imgW*(totalAR/imgAR))}×${S.imgH}` : 'фото не загружено — пример 1920×1080';
  return {W,H,imgAR,sideW,totalAR};
}

function render(){
  const g=layoutStage();
  stage.innerHTML='';
  stage.style.setProperty('--fs',S.fs);

  // фото
  const photoW = S.layout==='side' ? (g.imgAR/g.totalAR*100) : 100;
  const photo=h('div',{class:'photo'+(S.image?'':' empty'),style:{width:photoW+'%',right:'auto'}},
    S.image?null:'Перетащите сюда фотографию');
  if(S.image) photo.style.backgroundImage=`url("${S.image}")`;
  stage.append(photo);

  // панель
  const panel=h('div',{class:'de-panel'});
  panel.style.setProperty('--pa',S.alpha);
  panel.style.setProperty('--pa-top',Math.max(0,S.alpha-.3));
  if(S.layout==='side'){
    panel.style.left=photoW+'%'; panel.style.right='0';
    panel.style.setProperty('--pa',Math.max(S.alpha,.94));
    panel.style.setProperty('--pa-top',Math.max(S.alpha,.94));
    panel.style.background='rgb(var(--de-panel))';
  }else{
    panel.style.left=S.panelX+'%'; panel.style.width=S.panelW+'%';
  }
  panel.style.paddingBottom=`calc(var(--u)*${S.bottom})`;
  if(S.showScroll) panel.append(h('div',{class:'de-scroll'}));

  const text=h('div',{class:'de-text'});
  // последняя реплика с именем (и абзацы после неё) — яркие, всё выше — тусклое
  let lastNamed=-1; S.entries.forEach((e,i)=>{if(e.speaker)lastNamed=i});
  S.entries.forEach((e,i)=>{
    const dim = e.dim==='auto' ? (S.autoDim && i<lastNamed) : e.dim===true;
    const p=h('p',{class:'de-entry'+(e.speaker?'':' para')+(dim?' dim':'')});
    if(e.speaker){
      const nm=editable(h('span',{class:'de-name'}),()=>e.speaker,v=>{e.speaker=v},'ИМЯ');
      nm.style.color=e.color||speakerColor(e.speaker);
      p.append(nm);
      if(e.check){
        p.append(' ');
        p.append(editable(h('span',{class:'de-check'}),()=>e.check,v=>{e.check=v},'[проверка]'));
      }
      p.append(h('span',{class:'de-dash'},' – '));
    }
    p.append(editable(h('span',{class:'de-body'}),()=>e.text,v=>{e.text=v},'Текст реплики'));
    text.append(p);
  });

  if(S.options.length){
    const ol=h('ol',{class:'de-options'});
    S.options.forEach((o,i)=>{
      const li=h('li',{class:'de-opt '+(o.state||'normal')});
      li.append(h('span',{class:'num'},`${i+1}.`,h('span',{class:'hy'},' -')));
      if(o.check){ li.append(editable(h('span',{class:'ochk'}),()=>o.check,v=>{o.check=v},'[проверка]')); li.append(' '); }
      li.append(editable(h('span',{class:'otext'}),()=>o.text,v=>{o.text=v},'Вариант ответа'));
      ol.append(li);
    });
    text.append(ol);
  }
  if(S.showContinue){
    const b=h('div',{class:'de-continue'});
    b.append(editable(h('span'),()=>S.continueText,v=>{S.continueText=v;$('#continueText').value=v},'Продолжить'));
    b.append(h('span',{class:'tri'},'►'));
    text.append(b);
  }
  panel.append(text);
  stage.append(panel);

  // портрет
  if(S.showPortrait){
    const ph=S.portS; // % высоты сцены
    const pw=ph*0.71; // пропорции рамки из игры
    const port=h('div',{class:'de-portrait'});
    port.style.height=ph+'%';
    port.style.width=`calc(var(--u)*${pw})`;
    port.style.top=S.portY+'%';
    const leftPct = S.layout==='side' ? photoW : S.panelX;
    port.style.left=`calc(${leftPct}% - var(--u)*${pw*0.86})`;
    if(S.portrait) port.append(h('img',{src:S.portrait,alt:''}));
    else port.append(h('div',{style:{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'#55524d',font:'calc(var(--u)*1.4) PT Serif,serif',textAlign:'center'}},'портрет'));
    stage.append(port);
  }
}

/* ===================== Боковая панель ===================== */
function fillDatalists(){
  const dl=$('#speakers'); dl.innerHTML='';
  for(const a of Object.values(ATTR)) for(const s of a.skills) dl.append(h('option',{value:s},a.name));
  for(const n of NPCS) dl.append(h('option',{value:n},'персонаж'));
  const dc=$('#checks'); dc.innerHTML='';
  for(const d of DIFFS) for(const r of ['Успех','Провал']) dc.append(h('option',{value:`[${d}: ${r}]`}));
}
function colorSelect(e,input){
  // быстрые цвета атрибутов
  const wrap=h('div',{class:'tools'});
  [['intellect'],['psyche'],['physique'],['motorics']].forEach(([k])=>{
    wrap.append(h('button',{class:'btn sm',title:ATTR[k].name,style:{padding:'3px 5px'},onclick:()=>{e.color=ATTR[k].color;input.value=e.color;render();save()}},h('span',{class:'chip',style:{background:ATTR[k].color}})));
  });
  wrap.append(h('button',{class:'btn sm',title:'Персонаж (белый)',style:{padding:'3px 5px'},onclick:()=>{e.color=NPC_COLOR;input.value=e.color;render();save()}},h('span',{class:'chip',style:{background:NPC_COLOR}})));
  return wrap;
}
function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]}

function renderSide(){
  const box=$('#entries'); box.innerHTML='';
  S.entries.forEach((e,i)=>{
    const color=h('input',{type:'color',value:e.color||speakerColor(e.speaker),title:'Цвет имени'});
    color.oninput=()=>{e.color=color.value;render();save()};
    const sp=h('input',{type:'text',list:'speakers',value:e.speaker,placeholder:e.speaker===''?'(абзац без имени)':'ИМЯ'});
    sp.dataset.k='sp'+e.id;
    sp.oninput=()=>{e.speaker=sp.value.toUpperCase();const c=speakerColor(e.speaker);e.color=c;color.value=c;render();save()};
    const ck=h('input',{type:'text',list:'checks',value:e.check||'',placeholder:'[Сложно: Успех] — необязательно'});
    ck.dataset.k='ck'+e.id;
    ck.oninput=()=>{e.check=ck.value;render();save()};
    const tx=h('textarea',{rows:3},''); tx.value=e.text; tx.dataset.k='tx'+e.id;
    tx.oninput=()=>{e.text=tx.value;render();save()};
    const dim=h('select',{style:{width:'auto'},title:'Приглушение'},
      h('option',{value:'auto'},'авто'),h('option',{value:'yes'},'тусклая'),h('option',{value:'no'},'яркая'));
    dim.value=e.dim==='auto'?'auto':(e.dim?'yes':'no');
    dim.onchange=()=>{e.dim=dim.value==='auto'?'auto':dim.value==='yes';render();save()};
    box.append(h('div',{class:'card'},
      h('div',{class:'head'},color,h('div',{class:'grow'},sp),
        h('div',{class:'tools'},
          h('button',{class:'btn sm',title:'Выше',onclick:()=>{move(S.entries,i,-1);all()}},'↑'),
          h('button',{class:'btn sm',title:'Ниже',onclick:()=>{move(S.entries,i,1);all()}},'↓'),
          h('button',{class:'btn sm',title:'Удалить',onclick:()=>{S.entries.splice(i,1);all()}},'✕'))),
      e.speaker!==''?h('div',{class:'checkline'},ck):null,
      tx,
      h('div',{class:'row',style:{marginTop:'6px',marginBottom:0}},colorSelect(e,color),h('span',{style:{flex:1}}),dim)
    ));
  });

  const ob=$('#options'); ob.innerHTML='';
  S.options.forEach((o,i)=>{
    const ck=h('input',{type:'text',value:o.check||'',placeholder:'[Логика — Средне 10] — необязательно'});
    ck.dataset.k='ock'+o.id;
    ck.oninput=()=>{o.check=ck.value;render();save()};
    const tx=h('input',{type:'text',value:o.text,placeholder:'Вариант ответа'});
    tx.dataset.k='otx'+o.id;
    tx.oninput=()=>{o.text=tx.value;render();save()};
    const st=h('select',{style:{width:'auto'}},h('option',{value:'normal'},'обычный'),h('option',{value:'hover'},'наведён'),h('option',{value:'used'},'выбранный ранее'));
    st.value=o.state||'normal'; st.onchange=()=>{o.state=st.value;render();save()};
    ob.append(h('div',{class:'card'},
      h('div',{class:'head'},h('strong',{},`${i+1}.`),h('div',{class:'grow'},tx),
        h('div',{class:'tools'},
          h('button',{class:'btn sm',onclick:()=>{move(S.options,i,-1);all()}},'↑'),
          h('button',{class:'btn sm',onclick:()=>{move(S.options,i,1);all()}},'↓'),
          h('button',{class:'btn sm',onclick:()=>{S.options.splice(i,1);all()}},'✕'))),
      h('div',{class:'checkline'},ck,st)));
  });

  // глобальные контролы
  document.querySelectorAll('#layoutSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.layout));
  $('#posRow').style.display=S.layout==='side'?'none':'';
  $('#pWidth').value=S.panelW; $('#pX').value=S.panelX; $('#pAlpha').value=S.alpha; $('#fScale').value=S.fs; $('#pBottom').value=S.bottom;
  $('#autoDim').checked=S.autoDim; $('#showScroll').checked=S.showScroll;
  $('#showPortrait').checked=S.showPortrait; $('#portY').value=S.portY; $('#portS').value=S.portS;
  $('#showContinue').checked=S.showContinue; $('#continueText').value=S.continueText;
}
// после inline-правки на сцене — обновить поля без перерисовки
function syncSide(){
  S.entries.forEach(e=>{
    const set=(k,v)=>{const el=document.querySelector(`[data-k="${k}${e.id}"]`);if(el&&document.activeElement!==el)el.value=v};
    set('sp',e.speaker);set('ck',e.check||'');set('tx',e.text);
  });
  S.options.forEach(o=>{
    const set=(k,v)=>{const el=document.querySelector(`[data-k="${k}${o.id}"]`);if(el&&document.activeElement!==el)el.value=v};
    set('ock',o.check||'');set('otx',o.text);
  });
}
function all(){render();renderSide();save()}

/* ===================== Загрузка изображений ===================== */
function readImage(file,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>cb(r.result,img.naturalWidth,img.naturalHeight);img.src=r.result};
  r.readAsDataURL(file);
}
function setPhoto(file){ if(!file||!file.type.startsWith('image/'))return; readImage(file,(url,w,h)=>{S.image=url;S.imgW=w;S.imgH=h;all();toast('Фото загружено')}); }
$('#drop').onclick=()=>$('#fileImg').click();
$('#fileImg').onchange=e=>setPhoto(e.target.files[0]);
['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  e.preventDefault();
  if(ev==='drop'&&e.dataTransfer.files[0]) setPhoto(e.dataTransfer.files[0]);
}));
document.addEventListener('paste',e=>{
  if(document.activeElement&&(document.activeElement.isContentEditable||/INPUT|TEXTAREA/.test(document.activeElement.tagName)))return;
  const it=[...(e.clipboardData||{}).items||[]].find(i=>i.type.startsWith('image/'));
  if(it) setPhoto(it.getAsFile());
});
$('#clearImg').onclick=()=>{S.image=null;S.imgW=1920;S.imgH=1080;all()};
$('#pickPortrait').onclick=()=>$('#filePortrait').click();
$('#filePortrait').onchange=e=>{const f=e.target.files[0];if(f)readImage(f,url=>{S.portrait=url;S.showPortrait=true;all()})};

/* ===================== Контролы ===================== */
document.querySelectorAll('#layoutSeg button').forEach(b=>b.onclick=()=>{S.layout=b.dataset.v;all()});
const bindRange=(id,key)=>$(id).oninput=e=>{S[key]=+e.target.value;render();save()};
bindRange('#pWidth','panelW');bindRange('#pX','panelX');bindRange('#pAlpha','alpha');bindRange('#fScale','fs');bindRange('#pBottom','bottom');
bindRange('#portY','portY');bindRange('#portS','portS');
const bindChk=(id,key)=>$(id).onchange=e=>{S[key]=e.target.checked;render();save()};
bindChk('#autoDim','autoDim');bindChk('#showScroll','showScroll');bindChk('#showPortrait','showPortrait');bindChk('#showContinue','showContinue');
$('#continueText').oninput=e=>{S.continueText=e.target.value;render();save()};
$('#addEntry').onclick=()=>{S.entries.push({id:uid(),speaker:'КИМ КИЦУРАГИ',color:NPC_COLOR,check:'',text:'',dim:'auto'});all()};
$('#addPara').onclick=()=>{S.entries.push({id:uid(),speaker:'',color:NPC_COLOR,check:'',text:'',dim:'auto'});all()};
$('#addOpt').onclick=()=>{S.options.push({id:uid(),check:'',text:'',state:'normal'});all()};
$('#resetAll').onclick=()=>{if(confirm('Сбросить всё к примеру?')){const img={image:S.image,imgW:S.imgW,imgH:S.imgH};S=Object.assign(DEFAULT(),img);all()}};
$('#saveJson').onclick=()=>{const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),download:'disco-dialog.json'});a.click()};
$('#loadJson').onclick=()=>$('#fileJson').click();
$('#fileJson').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign(DEFAULT(),JSON.parse(t));all()}catch(_){toast('Не удалось прочитать файл')}})};

/* ===================== Экспорт ===================== */
async function renderPng(){
  document.activeElement&&document.activeElement.blur();
  await document.fonts.ready;
  stage.classList.remove('editing');
  const scale = S.imgH / stage.clientHeight;
  try{
    const raw = await html2canvas(stage,{scale,backgroundColor:null,useCORS:true,logging:false});
    // точный размер исходного фото (+ панель в режиме «рядом»), без пиксельного дрожания
    const out=document.createElement('canvas');
    out.width=Math.round(S.layout==='side' ? S.imgW*(1+S.panelW/100) : S.imgW);
    out.height=S.imgH;
    out.getContext('2d').drawImage(raw,0,0,out.width,out.height);
    return out;
  } finally { stage.classList.add('editing'); }
}
$('#savePng').onclick=async()=>{
  const c=await renderPng();
  c.toBlob(b=>{const a=h('a',{href:URL.createObjectURL(b),download:'disco-elysium-dialog.png'});a.click();toast('PNG сохранён')},'image/png');
};
$('#copyPng').onclick=async()=>{
  const c=await renderPng();
  c.toBlob(async b=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Скопировано в буфер')}catch(e){toast('Браузер не дал доступ к буферу')}},'image/png');
};

/* ===================== Старт ===================== */
fillDatalists();
new ResizeObserver(()=>render()).observe($('#viewport'));
document.fonts.ready.then(render);
all();
</script>
